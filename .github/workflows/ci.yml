name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite-et-tests:
    name: Qualité et tests (PHP 8.3, MariaDB 10.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Conteneur jetable propre à la CI : aucun secret, mot de passe root vide.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: aviator_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aviator_test
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, gmp, intl, mbstring, pdo_mysql, sodium, zip, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dépendances PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Base de test en utf8mb4_unicode_ci
        run: mysql --host=127.0.0.1 --user=root -e "ALTER DATABASE aviator_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SELECT VERSION();"

      - name: Fichier d'environnement de la CI
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          # Clé d'empreinte générée à chaque exécution : rien n'est stocké dans la CI.
          echo "AVIATOR_BLIND_INDEX_KEY=$(php -r 'echo bin2hex(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Audit des dépendances
        run: composer audit

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Assets
        run: |
          npm ci
          npm run build

      - name: Tests Pest (MariaDB)
        run: php artisan test
